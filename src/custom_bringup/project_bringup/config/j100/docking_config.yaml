/*/docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 5.0           # Control frequency (Hz) for vision-control loop
    initial_perception_timeout: 5.0     # Timeout (s) to wait to obtain intial perception of the dock
    wait_charge_timeout: 5.0            # Timeout (s) to wait to see if charging starts after docking
    dock_approach_timeout: 30.0         # Timeout (s) to attempt vision-control approach loop
    undock_linear_tolerance: 0.05       # Tolerance (m) to exit the undocking control loop at staging pose
    undock_angular_tolerance: 0.1       # Angular Tolerance (rad) to exist undocking loop at staging pose
    max_retries: 3                      # Maximum number of retries to attempt
    base_frame: "base_link"             # Robot's base frame for control law
    fixed_frame: "odom"                 # Fixed frame to use, recommended to be a smooth odometry frame not map
    odom_topic: "odometry_converted"      # The topic to use for the odometry data
    dock_prestaging_tolerance: 0.5      # L2 distance in X,Y,Theta from the staging pose to bypass navigation
    rotate_to_dock_timeout: 10.0        # Timeout (s) to attempt rotate-to-dock loop
    rotation_angular_tolerance: 0.05    # Angular tolerance (rad) to exit the rotation loop when rotate_to_dock is enable

    # dock_backwards: false             # Whether the robot is docking with the dock forward or backward in motion (Depreciated paramater)
    # navigator_bt_xml: ""              # BT XML to use for Navigator, if non-default
    # navigator_bt_xml: "docking_server/behavior_trees/navigator_to_dock.xml"

    controller:
      k_phi: 3.0                                  # Ratio of the rate of change in phi to the rate of change in r. Controls the convergence of the slow subsystem
      k_delta: 2.0                                # Constant factor applied to the heading error feedback. Controls the convergence of the fast subsystem
      beta: 0.4                                   # Constant factor applied to the path curvature. This value must be positive. Determines how fast the velocity drops when the curvature increases
      lambda: 2.0                                 # Constant factor applied to the path curvature. This value must be greater or equal to 1. Determines the sharpness of the curve: higher lambda implies sharper curves
      v_linear_min: 0.15                          # Minimum linear velocity (m/s)
      v_linear_max: 0.2                           # Maximum linear velocity (m/s)
      v_angular_max: 0.5                          # Maximum angular velocity (rad/s) produced by the control law
      slowdown_radius: 0.5                        # Radius (m) around the goal pose in which the robot will start to slow down
      use_collision_detection: false              # Whether to use collision detection to avoid obstacles
      rotate_to_heading_angular_vel: 1.0          # Angular velocity (rad/s) to rotate to the goal heading when rotate_to_dock is enabled
      rotate_to_heading_max_angular_accel: 3.2    # Maximum angular acceleration (rad/s^2) to rotate to the goal heading when rotate_to_dock is enabled
      transform_tolerance: 0.5                    # Time with which to post-date the transform that is published, to indicate that this transform is valid into the future.
      projection_time: 5.0                        # Time to look ahead for collisions (s).
      simulation_time_step: 0.1                   # Time step for projections (s).
      dock_collision_threshold: 0.3               # Distance (m) from the dock pose to ignore collisions.
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"

    # Types of docks
    dock_plugins: ["jackal_dock"] #A set of dock plugins to load
    jackal_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.2              # If not using stall detection, the pose threshold to the docking pose where isDocked() = true
      charging_threshold: 0.5               # Threshold of current in battery state above which isCharging() = true
      staging_x_offset: -1.0                # Staging pose offset forward (negative) of dock pose (m)
      staging_yaw_offset: 0.0               # Staging pose offset yaw (rad) of dock pose
      dock_direction: "forward"             # Whether the robot is docking with the dock forward or backward in motion
      rotate_to_dock: false                 # Enables backward docking without requiring a sensor for detection during the final approach.
      use_battery_status: false             # Whether to use the battery state message or isDocked() for isCharging()
      use_stall_detection: false            # Whether or not to use stall detection for isDocked() or positional threshold
      use_external_detection_pose: false    # Whether to use external detection topic for dock or use the databases' pose

      # To Use with external pose detection
      # subscribe_toggle: false         # If true, dynamically subscribe/unsubscribe to detected_dock_pose topic when start/stopDetectionProcess are called. If false, the subscription is kept alive throughout the plugin's lifecycle if use_external_detection_pose is true
      # detector_service_name: ""       # Trigger service name to start/stop the detector (e.g., a camera node or an AprilTag detector node). Leave empty to disable service calls.
      # detector_service_timeout: 5.0   # Timeout (seconds) to wait for the detector service (if detector_service_name is set) to become available or respond.

      # # Stalling of robot
      # stall_joint_names: []           # Names in joint_states topic of joints to track
      # stall_velocity_threshold: 1.0   # The joint velocity below which to trigger isDocked() = true
      # stall_effort_threshold: 1.0     # Current or motor effort in joint state to trigger isDocked() = true

      # NOTE: the translation/rotation parameters do not work with PoseCorrectionNode, use the parameters defined in tags_36h11.yaml instead
      external_detection_timeout: 1.0           # Timeout at which if the newest detection update does not meet to fail
      external_detection_translation_x: -0.4    # X offset from detected pose for docking (m)
      external_detection_translation_y: 0.0     # Y offset from detected pose for docking (m)
      external_detection_rotation_roll: 1.57    # Roll offset from detected pose for docking pose (rad)
      external_detection_rotation_pitch: 0.0    # Pitch offset from detected pose for docking pose (rad)
      external_detection_rotation_yaw: 0.0      # Yaw offset from detected pose for docking pose (rad)
      filter_coef: 0.1                          # Dock external detection method filtering algorithm coefficient

    docks: ['charging_1'] # Instead of dock_database, the set of docks specified in the params file itself
    charging_1:
      type: "jackal_dock"
      frame: map
      id: "charging_1"
      pose: [1.145, 1.554, 1.57 ] # Actual location where the robot will stop.
      # pose: [1.145, 1.554, 0.0 ] # Actual location where the robot will stop.

    # Sep. file of dock instances so config file can be used in multiple locations
    # this param will be overridden by the one in the launch file
    # dock_database: husky_nav_bringup/config/husky_dock_database.yaml


